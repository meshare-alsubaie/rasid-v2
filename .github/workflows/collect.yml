name: build and deploy

# Collection no longer happens here, and this file is mostly the record of why.
#
# GitHub's runners are in the United States and a large share of Saudi
# government sites refuse them: nine of the eleven failures in the first cloud
# run were .gov.sa hosts that answer the owner's machine without complaint. A
# later measurement put it at 7 of 10 test sources from a data centre against
# 9 of 10 from Riyadh. So the machine in Riyadh was already the only real
# collector, and this workflow was collecting a worse copy of the same data
# four times a day and committing it.
#
# Two things then made that actively harmful rather than merely wasteful:
#
#   - The classifier is now a model running on the owner's own CPU. There is no
#     model on a runner, so a run here would fetch every page, judge none, and
#     commit a dataset in which every source is degraded and every record needs
#     manual review. It would look like a successful run.
#
#   - Two collectors writing to one branch already cost a round with a
#     cybersecurity announcement scored 95 in it.
#
# What a runner is still good at is building and publishing, which needs no
# Saudi address and no model. That is all it does now. The watcher on the
# owner's machine collects, judges, notifies, and pushes; this answers the push.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Two publishes racing would serve a half-updated site.
concurrency:
  group: rasid-v2-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the build, so broken code fails in seconds rather than shipping.
      - run: npm run typecheck

      # The honesty rules. A dataset that fails these is never published, which
      # is the whole point of running it between the push and the deploy.
      - run: npm run validate

      - env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
