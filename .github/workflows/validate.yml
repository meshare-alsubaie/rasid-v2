name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # undici 8 needs Node 22. See collect.yml for the failure it causes.
          node-version: 22
          cache: npm

      - run: npm ci

      # Types and schemas must agree before the data is judged.
      - run: npm run typecheck

      # Fails on any honesty violation: a value without provenance, a published
      # rule without its wording, a graduate-development record shown as open.
      - run: npm run validate

      # The rules that guard the two things a null must never become: a zero,
      # and a notification.
      #
      # test:classifier is deliberately not here any more. The classifier is a
      # model on the owner's own machine, and there is none on a runner - the
      # test correctly refuses to report success about questions it never
      # asked, so on CI it fails for the right reason and tells us nothing.
      # Its subject is covered here by test:relevance, which is a pure function
      # and runs anywhere. Run test:classifier on the machine that has the
      # model, where it means something.
      - run: npm run test:notify
      # The score itself: bands, the refusal to say zero without a reason to,
      # and the twenty benchmark announcements. No model, no network.
      - run: npm run test:relevance
      # The watcher's schedule, simulated over a day against the real dataset:
      # no host read twice inside its budget, and nothing starved.
      - run: npm run test:schedule
      # The two silent failures an adversarial audit proved: a window that never
      # opens because its status was cached, and a record deleted for the crime
      # of its page going quiet.
      - run: npm run test:lifecycle
      # The one judgement the sitemap reader makes alone: is this url worth
      # opening. It has been wrong before, on "cooperation" versus "co-op".
      - run: npm run test:sitemap
      # Dates are the one field where a careful guess is worse than none, so
      # they are a table lookup with a test table, not a prompt.
      - run: npm run test:hijri
      # Every case here is a page that actually broke extraction once.
      - run: npm run test:extract
      # Twenty real announcements against the specification's score bands. It
      # replays answers recorded once, so it costs nothing here; re-record with
      # "npm run build:benchmark" whenever the system prompt changes.
      - run: npm run test:benchmark
      # Twelve faults, each served by a local server, and the four slow failures
      # that only show up months in. Neither costs anything to run.
      - run: npm run test:faults
      - run: npm run test:longrun
      # The collector's own entry point. Two dashes in a comment once stopped it
      # parsing, and the round failed before it could write to its log.
      - run: npm run test:scripts
      # The checkers, checked. Twice a gate has passed while looking at nothing;
      # this plants a fault each one must catch and fails if it does not.
      - run: npm run test:gates
      # The filter that decides which pages are worth a closer look. A false
      # negative here is an announcement nobody ever looks at.
      - run: npm run test:costfilter
      #
      # Three gates run only on the owner's machine, and each for a reason a
      # runner cannot fix:
      #   test:triage   needs the local model, and an unreachable model makes
      #                 every page pass, which would report a perfect score for
      #                 a question never asked
      #   test:toast    needs Windows, since that is where the notification has
      #                 to appear
      #   test:classifier  same as triage
      # They are run by hand, or by the watcher's own machine, where they mean
      # something.

      # The repository is public. The README called this a gate before it was
      # one: it was a habit someone had to remember, run by hand, with nothing
      # stopping a commit that carried a key or a person's details.
      - run: npm run audit:privacy

      # An organisation watched only on somebody else's website is reported as
      # monitored while nothing of its own is ever read.
      - run: npm run audit:domains

      # Five gates that were in `npm run gates` and in no workflow, which makes
      # them habits rather than gates — the same gap `audit:privacy` above was
      # written to close. Each covers a way the dataset can lie: two records for
      # one announcement, a "quote" the page never wrote, a redaction that eats
      # live urls, a push channel that is down, and English or an em dash
      # reaching a screen that is meant to be Arabic.
      - run: npm run test:records
      - run: npm run test:copied
      - run: npm run test:redact
      - run: npm run test:push
      - run: npm run test:arabic

      # Acceptance criteria 8.7 are measured, not asserted: contrast on every
      # theme, and the Lighthouse bars the spec names. Both need a browser and a
      # real build, so they run last.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit:contrast
      # Nothing cut off the right edge of a phone, at three widths, against the
      # built site. It serves dist itself, so it needs no separate server.
      - run: npm run test:mobile
      - run: npm run audit:lighthouse
